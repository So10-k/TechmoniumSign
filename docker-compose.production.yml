services:
  client:
    build:
      context: .
      dockerfile: apps/OpenSign/Dockerhubfile
    container_name: techmoniumsign-client
    restart: unless-stopped
    env_file:
      - ${TECHMONIUMSIGN_ENV_FILE:-/opt/techmoniumsign/.env}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REACT_APP_SERVERURL: https://legal.samsprojects.xyz/api/app
    ports:
      - "127.0.0.1:3220:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

  server:
    build:
      context: .
      dockerfile: apps/OpenSignServer/Dockerhubfile
    container_name: techmoniumsign-server
    restart: unless-stopped
    env_file:
      - ${TECHMONIUMSIGN_ENV_FILE:-/opt/techmoniumsign/.env}
    environment:
      NODE_ENV: production
      PORT: 8080
      PUBLIC_URL: https://legal.samsprojects.xyz
      SERVER_URL: https://legal.samsprojects.xyz/api/app
      MONGODB_URI: mongodb://mongo:27017/techmoniumsign
      USE_LOCAL: "true"
    ports:
      - "127.0.0.1:3221:8080"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - files-data:/usr/src/app/files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - app

  mongo:
    image: mongo:8.0
    container_name: techmoniumsign-mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--quiet"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

networks:
  app:
    name: techmoniumsign-internal

volumes:
  mongo-data:
    name: techmoniumsign-mongo-data
  files-data:
    name: techmoniumsign-files-data
